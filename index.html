<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>Nut Run</title>
<style>
/* Layout: full-screen pixel-art canvas (tap to move); score pills top-centre (you left, grey right), home top-left, restart top-right; start and end cards centred */
:root{
  --ink:#2b1a10; --cream:#fff4dc; --green:#5aa040; --green-dark:#3b7a2a; --rust:#c96b33; --grey:#6b717d; --gold:#ffd84a;
  --ui:Verdana,Tahoma,sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:#2d5c41;overscroll-behavior:none;font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;touch-action:none}

/* ---------- corner buttons ---------- */
#home,#restart,#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.82);border:0;padding:0;
  box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none;cursor:pointer}
#home{left:calc(10px + env(safe-area-inset-left,0px))}
#restart{right:calc(10px + env(safe-area-inset-right,0px))}
#mute{right:calc(62px + env(safe-area-inset-right,0px))}
#mute .x{display:none} #mute.off .x{display:inline} #mute.off .w{display:none}
#home svg,#restart svg,#mute svg{width:24px;height:24px}
#home:active,#restart:active,#mute:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

/* ---------- score ---------- */
#score{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;
  display:flex;gap:10px;pointer-events:none}
.pill{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;border-radius:22px;background:rgba(255,244,220,.88);
  box-shadow:0 3px 0 rgba(0,0,0,.18);font-weight:bold;font-size:24px;color:var(--ink);min-width:66px;justify-content:center}
.pill.ai{padding:0 4px 0 10px;color:var(--grey)}
.pill canvas{width:46px;height:46px;image-rendering:pixelated}
.pill.zoom{box-shadow:0 0 0 3px var(--gold),0 3px 0 rgba(0,0,0,.18)}
.pop{animation:pop .4s ease-out}
@keyframes pop{40%{transform:scale(1.35)}}

/* ---------- start, countdown and end ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(20,40,28,.4)}
.overlay[hidden]{display:none}
.card{background:var(--cream);border-radius:22px;padding:14px 22px 18px;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:center;
  max-width:min(92vw,600px);max-height:92vh;overflow:auto;box-sizing:border-box;animation:pop .5s ease-out}
.card h1{margin:0 0 6px;font-size:clamp(26px,7vmin,46px);color:var(--rust);letter-spacing:1px}
.versus{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:bold;font-size:26px;color:var(--ink)}
.versus canvas{width:clamp(80px,22vmin,136px);height:clamp(80px,22vmin,136px);image-rendering:pixelated}
#levels{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px;max-width:200px;margin-inline:auto}
#levels button{width:44px;height:44px;border-radius:50%;border:0;font:bold 20px var(--ui);color:var(--ink);background:#e8d6b0;
  box-shadow:0 3px 0 rgba(0,0,0,.2);touch-action:manipulation;cursor:pointer}
#levels button.on{background:var(--gold)}
#levels button:disabled{opacity:.35;cursor:default}
@media (max-height:460px){#levels{max-width:none}}   /* short, wide screens: one row of levels */
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px;margin:4px 0;padding:2px 6px;border-radius:14px}
.row canvas.who{width:clamp(48px,12vmin,68px);height:clamp(48px,12vmin,68px);image-rendering:pixelated}
.row img{width:clamp(22px,5.5vmin,32px);height:clamp(22px,5.5vmin,32px);image-rendering:pixelated}
.row b{font-size:clamp(22px,6vmin,32px);margin:0 8px 0 2px;color:var(--ink)}
.row.win{background:rgba(255,216,74,.4)}
.buttons{display:flex;justify-content:center;gap:16px;margin-top:10px}
.go{width:92px;height:92px;border-radius:50%;border:0;background:var(--green);color:#fff;
  box-shadow:0 5px 0 var(--green-dark);touch-action:manipulation;cursor:pointer;display:inline-grid;place-items:center}
.go.small{width:70px;height:70px;background:#e8d6b0;color:var(--ink);box-shadow:0 5px 0 #b9a47c}
.go svg{width:52%;height:52%}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-dark)}
.go[hidden]{display:none}
.credit{margin:8px 0 0;font-size:11px;color:#8a7a60}
#count{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none;
  font-size:clamp(70px,26vmin,170px);font-weight:bold;color:#fff6a0;text-shadow:0 6px 0 var(--ink),0 0 20px rgba(0,0,0,.4)}
#count[hidden]{display:none}
</style>
</head>

    <div id="levels"></div>
  </div>
</div>
<div id="count" hidden></div>
<div id="end" class="overlay" hidden>

    <p class="credit">Voices: elevenlabs.io · Music: Eleven Music</p>

    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(ex, ey, 11 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3b1a0c'; ctx.beginPath(); ctx.moveTo(ex + Math.cos(an) * 9, ey + Math.sin(an) * 9);
    ctx.lineTo(ex + Math.cos(an + 2.4) * 7, ey + Math.sin(an + 2.4) * 7); ctx.lineTo(ex + Math.cos(an - 2.4) * 7, ey + Math.sin(an - 2.4) * 7); ctx.fill();
  }
  // nuts flying up to the score pills
  for (const f of flyers) {
    const el = document.getElementById(f.s.who === 'you' ? 'nYou' : 'nAi').getBoundingClientRect();
    const tx = (el.left + el.width / 2) * dpr / scale, ty = (el.top + el.height / 2) * dpr / scale, u = Math.min(1, f.t);
    const x = f.x + (tx - f.x) * u, y = f.y + (ty - f.y) * u - Math.sin(u * Math.PI) * 60, img = nutImg(f.type);
    if (img) ctx.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
  }
  drawFaces();
}
function drawArrow(x, y) {
  ctx.fillStyle = '#3b1a0c'; ctx.fillRect(x - 6, y - 14, 12, 14); ctx.beginPath(); ctx.moveTo(x - 13, y - 1); ctx.lineTo(x + 13, y - 1); ctx.lineTo(x, y + 13); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.fillRect(x - 4, y - 12, 8, 13); ctx.beginPath(); ctx.moveTo(x - 9, y + 1); ctx.lineTo(x + 9, y + 1); ctx.lineTo(x, y + 10); ctx.fill();
}
// little animated squirrel faces in the score pills and cards
function drawFaces() {
  for (const c of document.querySelectorAll('canvas.face')) {
    if (!c.offsetParent) continue;
    const g = c.getContext('2d'), who = c.dataset.who;
    const eating = c.dataset.eat === '1';
    const F = frame(who, eating ? 'eat' : 'idle', Math.floor(time * (eating ? 8 : 6)));
    g.clearRect(0, 0, 68, 68); if (!F.img) continue;
    g.save(); if (c.dataset.flip) { g.translate(68, 0); g.scale(-1, 1); }
    g.drawImage(F.img, F.sx + 6, F.sy + 6, 68, 68, 0, 0, 68, 68); g.restore();   // the 68px middle of the 80px cell
  }
}

/* ======== score, start and end ======== */
function updateScore(reset) {
  for (const [s, id] of [[you, 'nYou'], [ai, 'nAi']]) {
    const el = document.getElementById(id); if (reset) s.shown = 0;
    if (el.textContent !== String(s.shown)) { el.textContent = s.shown; el.parentNode.classList.remove('pop'); void el.offsetWidth; el.parentNode.classList.add('pop'); }
  }
  if (reset) document.querySelectorAll('.pill').forEach(p => p.classList.remove('zoom'));
}
function showStart(level) {
  round++; newGame(level); phase = 'start'; if (AC) Music.stop(0.3);
  document.getElementById('count').hidden = true;
  document.getElementById('startTitle').textContent = 'Level ' + (level + 1);
  const unlocked = store.get('unlocked', 0), box = document.getElementById('levels'); box.innerHTML = '';
  LEVELS.forEach((_, i) => {
    const b = document.createElement('button'); b.textContent = i + 1; b.disabled = i > unlocked; b.classList.toggle('on', i === level);
    b.addEventListener('click', () => { audio(); showStart(i); }); box.appendChild(b);
  });
  document.getElementById('start').hidden = false;
}
function startRound() {
  audio(); document.getElementById('start').hidden = true; document.getElementById('end').hidden = true;
  phase = 'count'; const el = document.getElementById('count'); const r = ++round;
  say('level' + (LEVEL + 1), 3);
  const steps = [['three', '3'], ['two', '2'], ['one', '1'], ['go', 'Go!']];
  steps.forEach(([key, t], i) => setTimeout(() => {
    if (r !== round) return;   // restarted meanwhile
    el.hidden = false; el.textContent = t; SFX.count(i === 3); say(key, 3);
    if (i === 3) {
      phase = 'play'; ai.think = 0.8; Music.start();
      setTimeout(() => { if (r === round) el.hidden = true; }, 700);
      if (LEVEL === 0) setTimeout(() => { if (r === round && !tapped) say('tap', 2); }, 1500);
    }
  }, 1300 + i * 950));
}
function showEnd() {
  phase = 'end'; Music.stop(0.5);
  const youWin = you.score > ai.score, tie = you.score === ai.score, last = LEVEL === LEVELS.length - 1;
  if (youWin || tie) store.set('unlocked', Math.max(store.get('unlocked', 0), Math.min(LEVEL + 1, LEVELS.length - 1)));
  document.getElementById('endTitle').textContent = tie ? "It's a tie!" : youWin ? (last ? 'You won every level!' : 'You win!') : 'Grey wins this time!';
  (youWin || tie ? SFX.win : SFX.lose)();
  setTimeout(() => say(tie ? 'tie' : youWin ? (last ? 'allDone' : 'win') : 'lose', 3), 400);
  for (const [s, id] of [[you, 'rowYou'], [ai, 'rowAi']]) {
    const row = document.getElementById(id); row.innerHTML = '';
    const other = s === you ? ai : you, won = s.score > other.score;
    const who = document.createElement('canvas'); who.width = who.height = 68; who.className = 'face who';
    who.dataset.who = s.who; if (s.who === 'ai') who.dataset.flip = '1'; if (won) who.dataset.eat = '1';
    row.appendChild(who);
    const b = document.createElement('b'); b.textContent = s.score; row.appendChild(b);
    for (const type of s.got) { if (!nutImg(type)) continue; const img = new Image(); img.src = nutImg(type).src; img.alt = ''; row.appendChild(img); }
    row.classList.toggle('win', won);
  }
  document.getElementById('next').hidden = !(youWin || tie);
  document.getElementById('end').hidden = false;
}

/* ======== input: tap where you want to go ======== */
function tapAt(clientX, clientY) {
  if (phase !== 'play') return;
  const wx = clientX * dpr / scale + cx0, wy = clientY * dpr / scale + cy0;
  let goal = null, bd = TAP_NUT;
  for (const n of nuts) if (n.state === 'rest') { const d = Math.hypot(n.x - wx, n.y - wy); if (d < bd) { bd = d; goal = {p: n.p, x: n.x}; } }
  if (!goal) {   // otherwise the nearest branch (or the ground), favouring the one under the finger
    bd = Infinity;
    PLATS.forEach((p, i) => { const x = clamp(wx, p.x1, p.x2), dy = wy - pY(p, x), d = Math.hypot(x - wx, dy < 0 ? dy * 0.6 : dy * 1.6); if (d < bd) { bd = d; goal = {p: i, x}; } });
  }
  const P = plan(you, [goal]); follow(you, P, P.goals[0]);
  you.marker = {x: P.goals[0].x, y: P.goals[0].y, t: time};
  tapped = true; SFX.tap();
}
cvs.addEventListener('pointerdown', e => { audio(); tapAt(e.clientX, e.clientY); });
addEventListener('contextmenu', e => e.preventDefault());
document.getElementById('play').addEventListener('click', startRound);
document.getElementById('restart').addEventListener('click', () => { audio(); showStart(LEVEL); });
document.getElementById('again').addEventListener('click', () => { audio(); newGame(LEVEL); startRound(); });
document.getElementById('next').addEventListener('click', () => { audio(); showStart((LEVEL + 1) % LEVELS.length); });
document.getElementById('mute').addEventListener('click', () => { audio(); setMuted(!muted); });
setMuted(muted);
addEventListener('resize', resize);

/* ======== main loop ======== */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(tick);
}
ready.then(() => { showStart(Math.min(store.get('unlocked', 0), LEVELS.length - 1)); resize(); requestAnimationFrame(tick); });
</script>

// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (pictures,
// voice clips, music) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
